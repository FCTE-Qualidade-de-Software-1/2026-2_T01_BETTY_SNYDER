exclude_docs: |
  avaliacao/checklist-pc2.md
  criterios-gitpage.md
  dados.md
nav:
  - Início: index.md
  - Fase 1: fase1.md
  - Fase 2: fase2.md
  - Fase 3:
      - Visão geral: fase3.md
      - Ambiente: avaliacao/protocolos/ambiente.md
      - Capacidade de interação:
          - Pré-entrevista com participante: avaliacao/protocolos/pre-entrevista-participante.md
          - Entrevista com participante: avaliacao/protocolos/entrevista.md
          - Análise de Capacidade de interação: avaliacao/analise/interacao.md
          - Atas:
              - Ata sessão PA01: avaliacao/atas/sessao-PA01_2026-11-14.md
              - Ata verificação PA01 (protótipo): avaliacao/atas/sessao-PA01-verificacao-prototipo_2026-11-22.md
              - Ata sessão PB01: avaliacao/atas/sessao-PB01_2026-11-13.md
              - Ata sessão PB02: avaliacao/atas/sessao-PB02_2026-11-13.md
              - Ata sessão PB03: avaliacao/atas/sessao-PB03_2026-11-21.md
              - Feedback PC2: avaliacao/atas/feedback-PC2_2026-11-16.md
      - Eficiência de desempenho:
          - Protocolo: avaliacao/protocolos/desempenho.md
          - Análise de desempenho (Triangulação): avaliacao/analise/desempenho.md
          - Ferramentas e scripts: avaliacao/scripts/README.md
      - Flexibilidade:
          - Instalação e desinstalação: avaliacao/protocolos/flexibilidade-instalacao.md
          - Checklist de integração: avaliacao/protocolos/flexibilidade-checklist.md
          - Migração: avaliacao/protocolos/flexibilidade-migracao.md
  - Fase 4:
      - Visão geral: fase4.md
      - Avaliação de Capacidade de interação: avaliacao/analise/interacao.md
      - Avaliação de Eficiência de desempenho: avaliacao/analise/desempenho.md
      - Avaliação de Flexibilidade: avaliacao/analise/flexibilidade.md
      - Protótipo da ação de melhoria: prototipo-acao-melhoria.md
  - Artigo: artigo.md
  - Gestão PSM:
      - Visão geral: gestao-psm.md
      - Planejamento E2: gestao-psm/planejamento-e2.md
      - 1. Recursos e custos: gestao-psm/recursos-e-custos.md
      - 2. Calendário e progresso: gestao-psm/calendario-e-progresso.md
      - 3. Desempenho dos processos: gestao-psm/desempenho-dos-processos.md
      - Organização no GitHub: gestao-psm/github-organizacao.md
  - Retrospectiva E1: retrospectiva-e1.md
  - Atas:
      - "Reunião 01: Ata": atas/reuniao-01-ata.md
      - "Reunião 01: Decisões": atas/reuniao-01-decisoes.md
      - "Reunião 02: Ata": atas/reuniao-02-ata.md
      - "Reunião 03: Ata": atas/reuniao-03-ata.md
      - "Reunião 04: Ata": atas/reuniao-04-ata.md


theme:
  name: material
  language: pt-BR
  logo: assets/anki.png
  favicon: assets/anki.png
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js

extra_css:
  - stylesheets/anki.css
