site_name: BETTY SNYDER
copyright: "Equipe Betty Snyder · FGA0315 Qualidade de Software 1 · Versão E1 (Fases 1 e 2) · Atualizado em 20/10/2026"
site_url: https://FCTE-Qualidade-de-Software-1.github.io/2026-2_T01_BETTY_SNYDER/
nav:
  - Início: index.md
  - Fase 1: fase1.md
  - Fase 2: fase2.md
  - Artigo: artigo.md
  - Atas:
      - Reunião 01 — Ata: atas/reuniao-01-ata.md
      - Reunião 01 — Decisões: atas/reuniao-01-decisoes.md
      - Reunião 02 — Ata: atas/reuniao-02-ata.md
      - Reunião 03 — Ata: atas/reuniao-03-ata.md


theme:
  name: material
  language: pt-BR
  logo: assets/anki.png
  favicon: assets/anki.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/anki.css